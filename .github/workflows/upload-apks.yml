name: Bridge APKs from Drive to Release
on: 
  workflow_dispatch:

jobs:
  upload_assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install gdown
        run: pip install gdown

      - name: Download APKs from Drive Folder
        # The -O flag creates a local directory named 'release_apks' and puts the 3 files inside
        run: gdown --folder 1mIbS5oByZ923aEKzRw6BJkQhDlS8wuNA -O release_apks

      - name: Upload to Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # UPDATE THE VERSION TAG HERE FOR FUTURE RELEASES (e.g., v9.14.26)
          # The *.apk wildcard tells the CLI to grab every APK inside the folder automatically
          gh release upload v9.13.26 release_apks/*.apk --clobber
